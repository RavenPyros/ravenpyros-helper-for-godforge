<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 260px;
            padding: 14px;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: #eee;
        }
        h1 { font-size: 14px; margin: 0 0 12px 0; color: #facc15; text-align: center; }
        h2 { font-size: 11px; margin: 14px 0 6px; color: #999; text-transform: uppercase; letter-spacing: .05em; }
        .status { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #ccc; }
        .status b { color: #facc15; }
        .group { background: #222; border: 1px solid #333; border-radius: 8px; }
        .opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; font-size: 13px; }
        .opt + .opt { border-top: 1px solid #2d2d2d; }
        .opt small { display: block; color: #888; font-size: 11px; }
        .opt select { background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; font-size: 12px; }
        .links { margin-top: 12px; text-align: center; font-size: 11px; }
        .links a { color: #facc15; text-decoration: none; margin: 0 4px; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #06b6d4; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>
    <h1>RavenPyros Helper for Godforge</h1>

    <div class="status" id="duels-status">Open <a href="https://godforge.gg/duels" target="_blank" style="color:#facc15">Godforge Duels</a> to see your progress here.</div>

    <h2>Godforge Duels</h2>
    <div class="group">
        <label class="opt"><span>Reward panel<small>Progress, deadlines and things to claim</small></span>
            <span class="switch"><input type="checkbox" data-key="rp_duels_panel" checked><span class="slider"></span></span></label>
        <label class="opt"><span>Open duel rooms<small>See rooms waiting for an opponent, and list your own on RavenPyros</small></span>
            <span class="switch"><input type="checkbox" data-key="rp_rooms" checked><span class="slider"></span></span></label>
        <label class="opt"><span>Deck import<small>Send to Godforge on a RavenPyros deck: see which cards you own, save it to your Armory</small></span>
            <span class="switch"><input type="checkbox" data-key="rp_armory" checked><span class="slider"></span></span></label>
        <label class="opt"><span>Reward picker links<small>Read up before you pick your hero, weapon or imprint</small></span>
            <span class="switch"><input type="checkbox" data-key="rp_reward_links" checked><span class="slider"></span></span></label>
        <div class="opt"><span>Daily login reminder<small>Red ! on this icon if you haven't opened Duels by
            <select id="reminder-hour" aria-label="Reminder time"></select></small></span>
            <label class="switch"><input type="checkbox" data-key="rp_reminder" checked aria-label="Daily login reminder"><span class="slider"></span></label></div>
        <label class="opt"><span>Also send a notification<small>Once a day, when the reminder is due</small></span>
            <span class="switch"><input type="checkbox" id="notify-toggle"><span class="slider"></span></span></label>
    </div>

    <div class="links">
        <a href="https://www.ravenpyros.com/godforge-duels" target="_blank">Duels guide</a>&middot;
        <a href="https://www.ravenpyros.com/godforge-duels/decks" target="_blank">Decks</a>&middot;
        <a href="https://www.ravenpyros.com/godforge-duels/cards" target="_blank">Cards</a>&middot;
        <a href="https://www.ravenpyros.com/godforge-duels/rooms" target="_blank">Open rooms</a>
    </div>
    <div style="margin-top: 10px; text-align: center;">
        <a href="https://www.ravenpyros.com/members/membership?utm_source=extension&utm_medium=popup" target="_blank" style="color: #facc15; font-size: 11px; text-decoration: none; font-weight: bold; border: 1px solid #facc15; padding: 4px 8px; border-radius: 4px; display: inline-block;">
            &#10084; Become a supporter
        </a>
    </div>
    <div style="margin-top: 8px; text-align: center;">
        <span style="color: #555; font-size: 10px;" id="version"></span>
    </div>
    <script src="popup.js"></script>
</body>
</html>
